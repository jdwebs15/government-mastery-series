<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gov Game 5 — Bullet Match (Mastery)</title>

<style>
:root{
  --bg:#0b1220;
  --text:#e7eefc;
  --muted:#a8b4cf;
  --line:rgba(255,255,255,.12);
  --shadow:0 18px 55px rgba(0,0,0,.40);
  --radius:18px;
  --good:#2bd576;
  --bad:#ff5c7a;
  --warn:#ffd166;
  --accent:#7aa2ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,#0b1220,#070b14);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.app{
  width:min(1000px,100%);
  background:rgba(0,0,0,.2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}

h1{margin:0 0 8px;font-size:20px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}

button{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
button.primary{
  border-color:rgba(122,162,255,.45);
  background:rgba(122,162,255,.16);
}
button.danger{
  border-color:rgba(255,92,122,.45);
  background:rgba(255,92,122,.14);
}
button:hover{border-color:rgba(122,162,255,.35)}
button:disabled{opacity:.55;cursor:not-allowed}

/* ===== FIXED DROPDOWN STYLING ===== */
select{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.3);
  color:var(--text);
  outline:none;
}
select:focus{
  border-color:var(--accent);
}
select option{
  background:#0b1220;
  color:#e7eefc;
}

.row{
  display:grid;
  grid-template-columns:1fr 260px;
  gap:14px;
  margin-bottom:14px;
  align-items:center;
}

.msg{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  display:none;
}
.msg.good{background:rgba(43,213,118,.15);display:block}
.msg.bad{background:rgba(255,92,122,.15);display:block}
.msg.warn{background:rgba(255,209,102,.15);display:block}

.stats{
  margin-top:16px;
  font-size:13px;
  color:var(--muted);
}

.codeBox{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:rgba(0,0,0,.35);
  font-family:monospace;
  display:none;
}

.errBox{
  display:none;
  background:rgba(255,92,122,.15);
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div class="app">

<div id="errBox" class="errBox"></div>

<h1>Gov Game 5 — Bullet Match</h1>
<div class="sub">Match each bullet to the correct term. Mastery requires 0 misses.</div>

<div id="nameGate">
  <input id="studentName" placeholder="Enter your name" />
  <button class="primary" id="btnStart">Start</button>
</div>

<div id="gameArea" style="display:none;">

  <div id="questionArea"></div>

  <button class="primary" id="btnCheck">Check Answers</button>

  <div id="msgBox" class="msg"></div>

  <div class="stats">
    Accuracy: <span id="stAcc">0%</span> |
    Misses: <span id="stMiss">0</span> |
    Started: <span id="stStart"></span> |
    Completed: <span id="stEnd"></span>
  </div>

  <div id="codeBox" class="codeBox"></div>

  <div style="margin-top:14px;">
    <button class="danger" id="btnRestart">Restart</button>
  </div>

</div>

</div>

<script>
window.onerror=function(msg){
  const e=document.getElementById("errBox");
  e.style.display="block";
  e.textContent=msg;
};

// ================= QUESTION BANK =================
const data = [
  {
    bullets:[
      "Congress has two chambers.",
      "Members serve two-year terms.",
      "Initiates revenue bills."
    ],
    answers:["Legislative Branch"]
  },
  {
    bullets:[
      "Interprets laws.",
      "Can declare laws unconstitutional.",
      "Headed by Supreme Court."
    ],
    answers:["Judicial Branch"]
  },
  {
    bullets:[
      "Enforces laws.",
      "Commander in Chief.",
      "Can veto legislation."
    ],
    answers:["Executive Branch"]
  }
];

const choices=["Legislative Branch","Executive Branch","Judicial Branch"];

// ================= ENGINE =================
const nameGate=document.getElementById("nameGate");
const gameArea=document.getElementById("gameArea");
const btnStart=document.getElementById("btnStart");
const btnRestart=document.getElementById("btnRestart");
const btnCheck=document.getElementById("btnCheck");
const qArea=document.getElementById("questionArea");
const msgBox=document.getElementById("msgBox");
const stAcc=document.getElementById("stAcc");
const stMiss=document.getElementById("stMiss");
const stStart=document.getElementById("stStart");
const stEnd=document.getElementById("stEnd");
const codeBox=document.getElementById("codeBox");

let misses=0;
let startTime=null;

btnStart.onclick=()=>{
  if(document.getElementById("studentName").value.trim().length<2)return;
  nameGate.style.display="none";
  gameArea.style.display="block";
  startTime=new Date();
  stStart.textContent=startTime.toLocaleString();
  render();
};

btnRestart.onclick=()=>location.reload();

function render(){
  qArea.innerHTML="";
  data.forEach((item,i)=>{
    const div=document.createElement("div");
    div.className="row";

    const bullets=document.createElement("div");
    bullets.innerHTML=item.bullets.map(b=>`• ${b}`).join("<br>");

    const sel=document.createElement("select");
    sel.id="q"+i;
    sel.innerHTML=`<option value="">Select</option>`+
      choices.map(c=>`<option>${c}</option>`).join("");

    div.appendChild(bullets);
    div.appendChild(sel);
    qArea.appendChild(div);
  });
}

btnCheck.onclick=()=>{
  misses=0;
  data.forEach((item,i)=>{
    const val=document.getElementById("q"+i).value;
    if(!item.answers.includes(val))misses++;
  });

  const total=data.length;
  const correct=total-misses;
  const acc=Math.round((correct/total)*100);

  stAcc.textContent=acc+"%";
  stMiss.textContent=misses;

  if(misses===0){
    msgBox.className="msg good";
    msgBox.textContent="Mastery Achieved!";
    const endTime=new Date();
    stEnd.textContent=endTime.toLocaleString();
    codeBox.style.display="block";
    codeBox.textContent="Submit Code: GOV5-"+correct+total;
  }else{
    msgBox.className="msg warn";
    msgBox.textContent="Not Mastery. Fix mismatches.";
  }
};
</script>
</body>
</html>
